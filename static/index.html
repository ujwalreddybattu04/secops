<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Interpolation · Upload</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M3 18C11 18 10 5 21 5M3 12C10 12 15 17 21 9' stroke='%23242424' stroke-width='1.7' fill='none'/%3E%3C/svg%3E">
  <link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/upload.css">
  <script src="/assets/upload.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to upload</a>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-curve" viewBox="0 0 24 24"><path d="M3 18C11 18 10 5 21 5M3 12C10 12 15 17 21 9"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol>
    <symbol id="i-new" viewBox="0 0 24 24"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6M16 3l5 5-9 9-5 1 1-5z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1 0-4h13M9 7h6M9 11h6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 18V5M7 10l5-5 5 5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
    <div class="sidebar-heading"><a class="brand" href="/" aria-label="Interpolation home"><svg class="icon"><use href="#i-curve"/></svg><span>Interpolation</span></a><button class="icon-button" id="sidebar-toggle" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="sidebar-content"><svg class="icon"><use href="#i-sidebar"/></svg></button></div>
    <div class="sidebar-content" id="sidebar-content">
      <nav class="navigation" aria-label="Main"><button class="navigation-item active" id="new-upload" aria-label="New upload" aria-current="page"><svg class="icon"><use href="#i-new"/></svg><span>Upload</span></button><a class="navigation-item" href="/docs" target="_blank" rel="noopener" aria-label="Open API reference"><svg class="icon"><use href="#i-book"/></svg><span>API reference</span></a></nav>
      <section class="recent-section" aria-labelledby="recent-title"><h2 id="recent-title">Files this session</h2><p id="recent-empty">No files selected</p><div id="recent-files"></div></section>
    </div>
    <div class="sidebar-footer"><span class="workspace-avatar" aria-hidden="true">I</span><div><strong>Analyst workspace</strong><span>Interpolation</span></div></div>
  </aside>
  <button class="sidebar-backdrop" id="sidebar-backdrop" aria-label="Close navigation" hidden></button>

  <div class="main-shell">
    <header class="topbar"><button class="icon-button mobile-toggle" id="mobile-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"><svg class="icon"><use href="#i-sidebar"/></svg></button><span class="topbar-label"><svg class="icon"><use href="#i-curve"/></svg>CSV workspace</span></header>
    <main id="main">
      <section class="upload-start" aria-labelledby="upload-title">
        <h1 id="upload-title">What should we explore?</h1>
        <input id="file-input" type="file" accept=".csv,text/csv" class="visually-hidden" aria-label="Choose a yearly CSV">
        <div class="upload-composer" id="upload-composer" role="group" aria-label="Upload a yearly CSV" aria-describedby="file-help">
          <button class="composer-prompt" id="choose-file-prompt" data-file-picker>Drag and drop a yearly CSV here</button>
          <div class="file-chip" id="file-chip" hidden><span class="file-chip-icon"><svg class="icon"><use href="#i-file"/></svg></span><div><strong id="file-name"></strong><span id="file-size"></span></div><button class="icon-button" id="remove-file" aria-label="Remove selected file"><svg class="icon"><use href="#i-close"/></svg></button></div>
          <div class="composer-toolbar"><button class="icon-button add-file" data-file-picker aria-label="Add a CSV file" title="Choose a CSV"><svg class="icon"><use href="#i-plus"/></svg></button><span class="file-help" id="file-help">CSV · up to 10 MB</span><div class="composer-actions"><label class="method-picker"><span class="visually-hidden">Calculation method</span><select id="method-selector"><option value="average">Average</option><option value="exit">Exit</option></select><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></label><button class="upload-button" data-file-picker aria-label="Choose a CSV to upload" title="Choose a CSV"><svg class="icon"><use href="#i-upload"/></svg></button></div></div>
        </div>
        <p class="upload-error" id="upload-error" role="alert" hidden></p>
        <p class="selection-status" id="selection-status" role="status" aria-live="polite"></p>
        <aside class="intro-card" id="intro-card" aria-label="CSV format"><span class="intro-mark" aria-hidden="true"><svg class="icon"><use href="#i-curve"/></svg></span><div><h2>Start with your yearly data</h2><p>A year column, followed by one or more value columns.</p></div><button class="dismiss-button" id="dismiss-intro">Dismiss</button></aside>
      </section>
    </main>
  </div>
</body>
</html>
